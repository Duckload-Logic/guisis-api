services:
    api:
        image: ghcr.io/duckload-logic/guisis-api:staging
        container_name: capstone-staging-api
        ports:
            - "127.0.0.1:8081:8080"
        deploy:
            resources:
                limits:
                    cpus: "0.15"
                    memory: 150M
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_healthy
        networks:
            - staging-network
        restart: always
        env_file:
            - .env
        volumes:
            - uploads-data:/root/uploads

    redis:
        image: redis:7-alpine
        container_name: capstone-staging-redis
        command: redis-server --stop-writes-on-bgsave-error no
        deploy:
            resources:
                limits:
                    cpus: "0.10"
                    memory: 32M
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: always
        networks:
            - staging-network
        volumes:
            - redis-data:/data

    mysql:
        image: mysql:8.0
        container_name: capstone-staging-mysql
        command: >
            --performance-schema=OFF
            --innodb-buffer-pool-size=64M
            --max-connections=30
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 256M
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASS}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASS}
        healthcheck:
            test:
                - "CMD-SHELL"
                - "mysqladmin ping -p$$MYSQL_ROOT_PASSWORD"
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "127.0.0.1:3307:3306"
        restart: always
        networks:
            - staging-network
        volumes:
            - mysql-data:/var/lib/mysql

    gotenberg:
        image: gotenberg/gotenberg:8-chromium
        container_name: capstone-staging-gotenberg
        profiles:
            - qa-heavy
        deploy:
            resources:
                limits:
                    cpus: "0.50"
                    memory: 512M
        restart: always
        networks:
            - staging-network

    ai:
        image: ghcr.io/olazo-johnalbert/capstone-staging-ai:latest
        container_name: capstone-staging-ai
        profiles:
            - qa-heavy
        deploy:
            resources:
                limits:
                    cpus: "0.30"
                    memory: 800M
        healthcheck:
            test:
                - "CMD-SHELL"
                - |
                    python -c "
                    import urllib.request as u
                    u.urlopen('http://localhost:8000/health')
                    "
            interval: 30s
            timeout: 10s
            retries: 5
        dns:
            - 8.8.8.8
            - 1.1.1.1
        volumes:
            - hf-cache:/root/.cache/huggingface
        restart: always
        networks:
            - staging-network
        env_file:
            - .env

networks:
    staging-network:
        driver: bridge

volumes:
    redis-data:
    mysql-data:
    hf-cache:
    uploads-data:
