services:
    api:
        build:
            context: .
            target: prod
        ports:
            - "127.0.0.1:8080:${WEBSITES_PORT}"
        env_file:
            - .env
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_healthy
        networks:
            - app-network
        restart: always

    redis:
        image: redis:7-alpine
        container_name: capstone-redis
        command: redis-server --stop-writes-on-bgsave-error no
        deploy:
            resources:
                limits:
                    cpus: "0.25"
                    memory: 256M
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        restart: always
        networks:
            - app-network
        volumes:
            - redis-data:/data

    mysql:
        image: mysql:8.0
        container_name: capstone-mysql
        deploy:
            resources:
                limits:
                    cpus: "1.0"
                    memory: 1024M
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASS}
            MYSQL_DATABASE: ${DB_NAME}
            MYSQL_USER: ${DB_USER}
            MYSQL_PASSWORD: ${DB_PASS}
        healthcheck:
            test:
                - "CMD-SHELL"
                - "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"
            interval: 10s
            timeout: 5s
            retries: 5
        ports:
            - "127.0.0.1:3306:3306"
        restart: always
        networks:
            - app-network
        volumes:
            - mysql-data:/var/lib/mysql

    gotenberg:
        image: gotenberg/gotenberg:8
        container_name: capstone-gotenberg
        deploy:
            resources:
                limits:
                    cpus: "0.5"
                    memory: 512M
        restart: always
        networks:
            - app-network

networks:
    app-network:
        driver: bridge

volumes:
    redis-data:
    mysql-data:
