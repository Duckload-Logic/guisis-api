name: Build and Deploy

on:
    push:
        branches:
            - main
            - staging

permissions:
    packages: write
    contents: read

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=ref,event=branch

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Copy docker-compose file to VPS
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  source: >-
                      docker-compose.${{
                      github.ref_name == 'main'
                      && 'prod' || 'staging'
                      }}.yml
                  target: >-
                      /home/docker/projects/capstone-${{
                      github.ref_name == 'main'
                      && 'prod' || 'staging'
                      }}/

            - name: Deploy to Hostinger via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USERNAME }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  script: |
                      set -e
                      ENV_NAME="staging"
                      if [ "${{ github.ref_name }}" = "main" ]; then
                        ENV_NAME="prod"
                      fi
                      cd "/home/docker/projects/capstone-${ENV_NAME}"

                      mv docker-compose.${ENV_NAME}.yml docker-compose.yml

                      # Log into GHCR on the VPS
                      echo "${{ secrets.GITHUB_TOKEN }}" | \
                        docker login ghcr.io \
                        -u ${{ github.repository_owner }} \
                        --password-stdin

                      # Pull the newly pushed images
                      docker compose -f docker-compose.yml pull api

                      # Recreate containers
                      docker compose -f docker-compose.yml \
                        up -d --remove-orphans
