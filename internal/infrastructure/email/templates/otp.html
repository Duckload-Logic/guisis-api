<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Verification Code</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
        width: 100% !important;
      }
      .container {
        position: relative;
        background-color: #ffffff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        width: 100%;
        margin: 0 auto;
        text-align: center;
        overflow: hidden;
      }
      .logo {
        display: block;
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        color: #2c3e50;
        margin-bottom: 20px;
      }
      .logo img {
        display: block;
        margin: 0 auto 8px auto;
      }
      .title {
        font-size: 24px;
        font-weight: 600;
        color: #2c3e50;
        margin-bottom: 10px;
      }
      .subtitle {
        color: #6c757d;
        margin-bottom: 30px;
        font-size: 14px;
      }
      .otp-box {
        background-color: #f8f9fa;
        border: 2px dashed #630b0b;
        padding: 20px;
        border-radius: 8px;
        margin: 20px 0;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 5px;
        color: #630b0b;
        text-align: center;
      }
      .footer {
        margin-top: 30px;
        padding-top: 20px;
        border-top: 1px solid #e9ecef;
        color: #95a5a6;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f4f4f9"
    >
      <tr>
        <td align="center" style="padding: 24px 12px">
          <div class="container">
            <div
              style="
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 8px;
                background-color: #630b0b;
              "
            ></div>
            <div class="header">
              <div class="logo">
                <img
                  src="https://guisis.dllbsit2027.com/logo.svg"
                  width="50"
                  height="50"
                />
                <span>PUPT GuiSIS</span>
              </div>
            </div>
            <div class="title">Verification Code</div>
            <div class="subtitle">
              Use the OTP below to complete your fallback native login.
              This code will expire in 5 minutes.
            </div>

            <div class="otp-box">
              {{.OTP}}
            </div>

            <div class="footer">
              If you did not request this code, please ignore this email.
            </div>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
