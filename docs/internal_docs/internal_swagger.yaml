basePath: /api/v1
definitions:
  appointments.Appointment:
    properties:
      adminNotes:
        $ref: '#/definitions/structs.NullableString'
      appointmentCategoryId:
        type: integer
      createdAt:
        type: string
      id:
        type: string
      iirId:
        type: string
      prefDate1:
        $ref: '#/definitions/structs.NullableString'
      prefDate2:
        $ref: '#/definitions/structs.NullableString'
      prefDate3:
        $ref: '#/definitions/structs.NullableString'
      prefTimeSlotID1:
        $ref: '#/definitions/structs.NullableInt64'
      prefTimeSlotID2:
        $ref: '#/definitions/structs.NullableInt64'
      prefTimeSlotID3:
        $ref: '#/definitions/structs.NullableInt64'
      reason:
        $ref: '#/definitions/structs.NullableString'
      statusId:
        type: integer
      timeSlotId:
        type: integer
      updatedAt:
        type: string
      urgencyLevel:
        type: string
      urgencyScore:
        type: number
      whenDate:
        type: string
    type: object
  appointments.AppointmentCategory:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  appointments.AppointmentDTO:
    properties:
      adminNotes:
        $ref: '#/definitions/structs.NullableString'
      appointmentCategory:
        $ref: '#/definitions/appointments.AppointmentCategory'
      createdAt:
        type: string
      hasSignificantNote:
        type: boolean
      id:
        type: string
      iirId:
        type: string
      preferredDate1:
        type: string
      preferredDate2:
        type: string
      preferredDate3:
        type: string
      preferredTimeSlot1:
        $ref: '#/definitions/appointments.TimeSlot'
      preferredTimeSlot2:
        $ref: '#/definitions/appointments.TimeSlot'
      preferredTimeSlot3:
        $ref: '#/definitions/appointments.TimeSlot'
      reason:
        $ref: '#/definitions/structs.NullableString'
      status:
        $ref: '#/definitions/appointments.AppointmentStatus'
      studentCorUrl:
        type: string
      studentNumber:
        type: string
      timeSlot:
        $ref: '#/definitions/appointments.TimeSlot'
      updatedAt:
        type: string
      urgencyLevel:
        type: string
      urgencyScore:
        type: number
      user:
        $ref: '#/definitions/users.UserResponse'
      userId:
        type: string
      whenDate:
        type: string
    type: object
  appointments.AppointmentStatus:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  appointments.AvailableTimeSlotView:
    properties:
      id:
        type: integer
      isAvailable:
        type: boolean
      time:
        type: string
    type: object
  appointments.DailyStatusCount:
    properties:
      date:
        type: string
      pendingCount:
        type: integer
      rescheduledCount:
        type: integer
      scheduledCount:
        type: integer
    type: object
  appointments.StatusCount:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  appointments.TimeSlot:
    properties:
      id:
        type: integer
      time:
        type: string
    type: object
  integrations.ListStudentsSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/integrations.OGOSListStudentsResponse'
      status:
        allOf:
        - $ref: '#/definitions/response.JSendStatus'
        example: success
    type: object
  integrations.OGOSListStudentsResponse:
    properties:
      meta:
        $ref: '#/definitions/structs.PaginationMetadata'
      students:
        items:
          $ref: '#/definitions/integrations.OGOSStudentDTO'
        type: array
    type: object
  integrations.OGOSStudentAddressDTO:
    properties:
      addressType:
        type: string
      barangay:
        $ref: '#/definitions/locations.Barangay'
      city:
        $ref: '#/definitions/locations.City'
      province:
        $ref: '#/definitions/locations.ProvinceDTO'
      region:
        $ref: '#/definitions/locations.Region'
      streetDetail:
        $ref: '#/definitions/structs.NullableString'
      studentNumber:
        type: string
    type: object
  integrations.OGOSStudentDTO:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      middleName:
        $ref: '#/definitions/structs.NullableString'
      mobileNumber:
        type: string
      program:
        $ref: '#/definitions/students.Program'
      section:
        type: string
      studentNumber:
        type: string
      suffixName:
        type: string
      yearLevel:
        type: integer
    type: object
  integrations.OGOSStudentPersonalInfoDTO:
    properties:
      dateOfBirth:
        type: string
      gender:
        $ref: '#/definitions/students.Gender'
      heightM:
        type: number
      placeOfBirth:
        type: string
      studentNumber:
        type: string
      weightKg:
        type: number
    type: object
  integrations.StudentAddressSuccessResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/integrations.OGOSStudentAddressDTO'
        type: array
      status:
        allOf:
        - $ref: '#/definitions/response.JSendStatus'
        example: success
    type: object
  integrations.StudentPersonalInfoSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/integrations.OGOSStudentPersonalInfoDTO'
      status:
        allOf:
        - $ref: '#/definitions/response.JSendStatus'
        example: success
    type: object
  integrations.StudentSuccessResponse:
    properties:
      data:
        $ref: '#/definitions/integrations.OGOSStudentDTO'
      status:
        example: success
        type: string
    type: object
  locations.Barangay:
    properties:
      cityCode:
        type: integer
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  locations.City:
    properties:
      code:
        type: string
      district:
        $ref: '#/definitions/structs.NullableString'
      id:
        type: integer
      name:
        type: string
      provinceCode:
        $ref: '#/definitions/structs.NullableString'
      regionCode:
        $ref: '#/definitions/structs.NullableString'
      type:
        $ref: '#/definitions/structs.NullableString'
      zipCode:
        $ref: '#/definitions/structs.NullableString'
    type: object
  locations.ProvinceDTO:
    properties:
      code:
        $ref: '#/definitions/structs.NullableString'
      id:
        type: integer
      name:
        $ref: '#/definitions/structs.NullableString'
      regionCode:
        $ref: '#/definitions/structs.NullableString'
    type: object
  locations.Region:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.CommonErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      data: {}
      message:
        example: Detailed error message
        type: string
      status:
        example: fail
        type: string
    type: object
  response.JSendStatus:
    enum:
    - success
    - fail
    - error
    type: string
    x-enum-varnames:
    - StatusSuccess
    - StatusFail
    - StatusError
  slips.AttachmentDTO:
    properties:
      attachmentType:
        type: string
      fileName:
        type: string
      fileSize:
        type: integer
      fileType:
        type: string
      fileUrl:
        type: string
      id:
        type: string
      mimeType:
        type: string
      slipId:
        type: string
    type: object
  slips.Slip:
    properties:
      adminNotes:
        $ref: '#/definitions/structs.NullableString'
      categoryId:
        type: integer
      createdAt:
        type: string
      dateNeeded:
        type: string
      dateOfAbsence:
        type: string
      id:
        type: string
      iirId:
        type: string
      reason:
        type: string
      statusId:
        type: integer
      updatedAt:
        type: string
    type: object
  slips.SlipCategory:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  slips.SlipDTO:
    properties:
      adminNotes:
        $ref: '#/definitions/structs.NullableString'
      category:
        $ref: '#/definitions/slips.SlipCategory'
      createdAt:
        type: string
      dateNeeded:
        type: string
      dateOfAbsence:
        type: string
      hasSignificantNote:
        type: boolean
      id:
        type: string
      iirId:
        type: string
      isVerified:
        type: boolean
      reason:
        type: string
      status:
        $ref: '#/definitions/slips.SlipStatus'
      studentCorUrl:
        type: string
      studentNumber:
        type: string
      ticket:
        $ref: '#/definitions/slips.TicketDTO'
      updatedAt:
        type: string
      user:
        $ref: '#/definitions/users.UserResponse'
      userId:
        type: string
    type: object
  slips.SlipStatus:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  slips.SlipStatusCount:
    properties:
      count:
        type: integer
      id:
        type: integer
      name:
        type: string
    type: object
  slips.TicketClaimRequest:
    properties:
      ticketCode:
        type: string
    required:
    - ticketCode
    type: object
  slips.TicketDTO:
    properties:
      isVerified:
        type: boolean
      ticketCode:
        type: string
      verifiedAt:
        type: string
    type: object
  slips.UpdateStatusRequest:
    properties:
      adminNotes:
        type: string
      status:
        type: string
    required:
    - status
    type: object
  structs.NullableInt64:
    properties:
      int64:
        format: int64
        type: integer
      valid:
        description: Valid is true if Int64 is not NULL
        type: boolean
    type: object
  structs.NullableString:
    properties:
      string:
        type: string
      valid:
        description: Valid is true if String is not NULL
        type: boolean
    type: object
  structs.PaginationMetadata:
    properties:
      page:
        type: integer
      pagesSize:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
  students.Gender:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  students.ListStudentsResponse:
    properties:
      meta:
        $ref: '#/definitions/structs.PaginationMetadata'
      students:
        items:
          $ref: '#/definitions/students.StudentProfileDTO'
        type: array
    type: object
  students.Program:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  students.StudentProfileDTO:
    properties:
      email:
        type: string
      firstName:
        type: string
      gender:
        $ref: '#/definitions/students.Gender'
      iirId:
        type: string
      isStudentCorValid:
        type: boolean
      lastName:
        type: string
      middleName:
        $ref: '#/definitions/structs.NullableString'
      profilePicture:
        type: string
      program:
        $ref: '#/definitions/students.Program'
      section:
        type: integer
      status:
        $ref: '#/definitions/students.StudentStatus'
      studentCorUrl:
        type: string
      studentNumber:
        type: string
      suffixName:
        $ref: '#/definitions/structs.NullableString'
      userId:
        type: string
      yearLevel:
        type: integer
    type: object
  students.StudentStatus:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  users.Role:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  users.UserResponse:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      lastName:
        type: string
      middleName:
        $ref: '#/definitions/structs.NullableString'
      profilePicture:
        type: string
      roles:
        items:
          $ref: '#/definitions/users.Role'
        type: array
      suffixName:
        $ref: '#/definitions/structs.NullableString'
      updatedAt:
        type: string
    type: object
info:
  contact: {}
  title: Student data API
  version: "2.0"
paths:
  /appointments:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all appointments.
      parameters:
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Filter by start date
        in: query
        name: start_date
        type: string
      - description: Filter by end date
        in: query
        name: end_date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all appointments
      tags:
      - Appointments
    post:
      consumes:
      - application/json
      description: Schedules a new appointment for a student.
      parameters:
      - description: Appointment Details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/appointments.AppointmentDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Book a new appointment
      tags:
      - Appointments
  /appointments/calendar/stats:
    get:
      description: Retrieves appointment status counts by date.
      parameters:
      - description: Start date (YYYY-MM-DD)
        in: query
        name: start_date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointments.DailyStatusCount'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get daily status count
      tags:
      - Appointments
  /appointments/id/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves the details of a specific appointment.
      parameters:
      - description: Appointment ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/appointments.Appointment'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get appointment details
      tags:
      - Appointments
  /appointments/lookups/categories:
    get:
      description: Retrieves available appointment categories.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointments.AppointmentCategory'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get appointment categories
      tags:
      - Appointments
  /appointments/lookups/slots:
    get:
      description: Retrieves available time slots for a date.
      parameters:
      - description: Date (YYYY-MM-DD)
        in: query
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointments.AvailableTimeSlotView'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get available time slots
      tags:
      - Appointments
  /appointments/lookups/statuses:
    get:
      description: Retrieves available appointment statuses.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointments.AppointmentStatus'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get appointment statuses
      tags:
      - Appointments
  /appointments/me:
    get:
      description: Retrieves appointments for the authenticated student.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get student's appointments
      tags:
      - Appointments
  /appointments/stats:
    get:
      description: Retrieves appointment status counts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/appointments.StatusCount'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get appointment statistics
      tags:
      - Appointments
  /integrations/students/{studentNumber}:
    get:
      consumes:
      - application/json
      description: Get student information by student number
      parameters:
      - description: Student number of the student
        in: path
        name: studentNumber
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/integrations.StudentSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get student by student number
      tags:
      - External Students
  /integrations/students/{studentNumber}/addresses:
    get:
      consumes:
      - application/json
      description: Get all addresses of a student by their student number
      parameters:
      - description: Student number of the student
        in: path
        name: studentNumber
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/integrations.StudentAddressSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get student addresses by student number
      tags:
      - External Students
  /integrations/students/{studentNumber}/personal-info:
    get:
      consumes:
      - application/json
      description: Get personal information of a student by their student number
      parameters:
      - description: Student number of the student
        in: path
        name: studentNumber
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/integrations.StudentPersonalInfoSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get personal information by student number
      tags:
      - External Students
  /integrations/students/profile:
    get:
      consumes:
      - application/json
      description: Get student information by their email
      parameters:
      - description: Student Email
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/integrations.StudentSuccessResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get student by Email
      tags:
      - External Students
  /integrations/students/profiles:
    get:
      consumes:
      - application/json
      description: Get a paginated list of students with optional filters
      parameters:
      - description: Search term for student name or number
        in: query
        name: search
        type: string
      - description: Filter by program ID
        in: query
        name: program_id
        type: integer
      - description: Filter by gender ID
        in: query
        name: gender_id
        type: integer
      - description: Filter by year level
        in: query
        name: year_level
        type: integer
      - description: Order by field
        in: query
        name: order_by
        type: string
      - description: Page number for pagination
        in: query
        name: page
        type: integer
      - description: Number of items per page for pagination
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/integrations.ListStudentsSuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.CommonErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List students
      tags:
      - External Students
  /slips:
    get:
      description: Retrieves list of all submitted slips.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all excuse slips
      tags:
      - ExcuseSlips
    post:
      consumes:
      - multipart/form-data
      description: |-
        Allows a student to submit an excuse slip with
        supporting document (file upload).
      parameters:
      - description: Reason for absence
        in: formData
        name: reason
        required: true
        type: string
      - description: Date (YYYY-MM-DD)
        in: formData
        name: absenceDate
        required: true
        type: string
      - description: Supporting Document
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
